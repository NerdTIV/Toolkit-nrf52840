# Minimal BLE peripheral for the nRF52840 dongle

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="ZephyrPeriph"
CONFIG_BT_DEVICE_NAME_DYNAMIC=n

# Pas de pairing : le central va direct a la GATT discovery.
# A activer si on veut tester un scenario avec bonding.
CONFIG_BT_SMP=n
CONFIG_BT_MAX_CONN=1

# MTU : par defaut ATT tourne a 23 (donc 20 bytes utiles). On monte un peu
# pour servir des values plus grosses sans fragmenter.
CONFIG_BT_L2CAP_TX_MTU=65
CONFIG_BT_BUF_ACL_RX_SIZE=69

CONFIG_LOG=y
CONFIG_BT_DEVICE_APPEARANCE=0

# Sortie .uf2 en plus du .hex, pour le drag-drop flash
CONFIG_BUILD_OUTPUT_UF2=y
